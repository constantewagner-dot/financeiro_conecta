version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: athena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-athena}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-athenasql}
      POSTGRES_DB: ${DB_NAME:-athena_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: athena-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-athena}:${DB_PASSWORD:-athenasql}@db:5432/${DB_NAME:-athena_db}?schema=public
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    container_name: athena-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
