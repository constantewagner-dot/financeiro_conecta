<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financeiro Conecta</title>
  <link rel="stylesheet" href="css/style.css?v=6" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Financeiro Conecta</h1>
    <nav id="tabs">
      <button data-tab="dashboard" class="active">Dashboard</button>
      <button data-tab="pagar">Contas a Pagar</button>
      <button data-tab="receber">Contas a Receber</button>
      <button data-tab="alunos">Alunos</button>
      <button data-tab="matriculas">Matrículas</button>
      <button data-tab="cadastros">Cadastros</button>
      <button data-tab="relatorios">Relatórios</button>
      <button data-tab="config">Configurações</button>
    </nav>
  </header>

  <main id="content">
    <section id="tab-dashboard" class="tab"></section>
    <section id="tab-pagar" class="tab hidden"></section>
    <section id="tab-receber" class="tab hidden"></section>
    <section id="tab-alunos" class="tab hidden"></section>
    <section id="tab-matriculas" class="tab hidden"></section>
    <section id="tab-cadastros" class="tab hidden"></section>
    <section id="tab-relatorios" class="tab hidden"></section>
    <section id="tab-config" class="tab hidden"></section>
  </main>

  <footer>
    <span id="status"></span>
  </footer>

  <script src="js/github.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
